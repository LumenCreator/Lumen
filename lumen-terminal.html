<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Terminal</title>
<meta name="description" content="Geopolitical, macro and market intelligence terminal: situation map, contagion modelling, link analysis and an FVG backtest lab.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b0e13'/><path d='M28 72V28h10v34h24v10z' fill='%234c9aff'/></svg>">
<style>
/* Lumen Terminal — dark operations theme. */
:root {
  /* This terminal commits to one dark visual world by design; say so explicitly so it holds
     on any host ground rather than inheriting a light one. */
  color-scheme: dark;
  --bg:#080a0e; --panel:#0d1117; --panel2:#111823; --line:#1e2836; --grid:#161e29;
  --txt:#d7dee8; --dim:#7d8896; --dim2:#59646f;
  --accent:#4c9aff; --accent2:#2f6dd0;
  --up:#31c48d; --down:#f05252; --warn:#e8a33d; --sim:#8f7fe0; --info:#5fb3a1;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:4px;
}
* { box-sizing:border-box; }
html { height:100%; background:#080a0e; }
body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--txt);
  font:12px/1.45 var(--sans); overflow:hidden;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#222c3a; border-radius:5px; }
::-webkit-scrollbar-thumb:hover { background:#2e3a4b; }
a { color:var(--accent); }
h3,h4 { margin:0 0 6px; font-weight:600; }
h4 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
code, .mono { font-family:var(--mono); }
.up { color:var(--up); } .down { color:var(--down); } .warn { color:var(--warn); }

/* ---------- header ---------- */
#top {
  display:flex; align-items:center; gap:14px; padding:0 12px;
  height:48px; flex:0 0 48px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand { display:flex; align-items:center; gap:8px; }
.brand .logo { color:var(--accent); font-size:19px; }
.brand b { display:block; font-size:14px; letter-spacing:.16em; }
.brand small { display:block; font-size:9px; color:var(--dim2); letter-spacing:.12em; text-transform:uppercase; }

.cmd-wrap { position:relative; flex:1; max-width:640px; display:flex; align-items:center; }
.cmd-p { position:absolute; left:9px; color:var(--accent); font-family:var(--mono); }
#cmd {
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt);
  border-radius:var(--r); padding:7px 10px 7px 22px; font-family:var(--mono); font-size:12px; outline:none;
}
#cmd:focus { border-color:var(--accent2); box-shadow:0 0 0 2px rgba(76,154,255,.13); }
.cmd-drop {
  display:none; position:absolute; top:36px; left:0; right:0; z-index:200;
  background:var(--panel2); border:1px solid var(--line); border-radius:var(--r);
  max-height:340px; overflow:auto; box-shadow:0 12px 34px rgba(0,0,0,.6);
}
.cmd-s { display:flex; align-items:center; gap:9px; padding:6px 10px; cursor:pointer; border-bottom:1px solid #141b25; }
.cmd-s:hover, .cmd-s.on { background:#18202c; }
.cmd-s code { color:var(--accent); font-size:11px; min-width:150px; }
.cmd-s span { color:var(--dim); font-size:11px; flex:1; }

#nav { display:flex; gap:2px; }
.nav-b {
  background:none; border:1px solid transparent; color:var(--dim); cursor:pointer;
  padding:6px 11px; border-radius:var(--r); font:inherit; font-size:11.5px; white-space:nowrap;
}
.nav-b:hover { color:var(--txt); background:#141b25; }
.nav-b.on { color:var(--accent); background:#111d2e; border-color:#1d3a5c; }
.top-actions { display:flex; gap:4px; margin-left:auto; }
.icon-b {
  background:none; border:1px solid var(--line); color:var(--dim); width:28px; height:28px;
  border-radius:var(--r); cursor:pointer; font-size:13px;
}
.icon-b:hover { color:var(--accent); border-color:var(--accent2); }

/* ---------- status strip ---------- */
#status {
  display:flex; align-items:center; gap:16px; height:26px; flex:0 0 26px;
  padding:0 12px; background:#0a0d12; border-bottom:1px solid var(--line);
  font-family:var(--mono); font-size:10.5px; overflow:hidden;
}
.st-clock { display:flex; gap:7px; align-items:baseline; }
.st-clock b { color:var(--txt); }
.st-clock span { color:var(--dim2); }
.st-sess { display:flex; gap:6px; }
.sess { color:var(--dim2); letter-spacing:.05em; }
.sess.on { color:var(--up); }
.sess.on::before { content:'●'; margin-right:3px; font-size:8px; }
.st-tick { display:flex; gap:14px; overflow:hidden; flex:1; }
.tk { display:flex; gap:5px; align-items:baseline; cursor:pointer; white-space:nowrap; }
.tk:hover b { color:var(--accent); }
.tk b { color:var(--dim); font-weight:500; }
.tk i { font-style:normal; }
.tk u { text-decoration:none; font-size:10px; }
.st-right { display:flex; gap:8px; margin-left:auto; align-items:center; }
.regime { padding:1px 7px; border-radius:9px; border:1px solid; font-size:9.5px; letter-spacing:.06em; }
.regime.r-calm { color:var(--up); border-color:#1e4a39; background:#0d1c17; }
.regime.r-elev { color:var(--warn); border-color:#4a3a1a; background:#1c160c; }
.regime.r-high { color:var(--down); border-color:#4d2020; background:#1c0e0e; }
.mode { padding:1px 7px; border-radius:9px; font-size:9.5px; letter-spacing:.08em; border:1px solid; }
.mode.m-demo { color:var(--sim); border-color:#3a3160; background:#15122a; }
.mode.m-live { color:var(--up); border-color:#1e4a39; background:#0d1c17; }

/* ---------- layout ---------- */
#view { flex:1; overflow:auto; padding:10px; }
#foot {
  flex:0 0 22px; height:22px; display:flex; align-items:center; gap:10px; padding:0 12px;
  background:#0a0d12; border-top:1px solid var(--line); color:var(--dim2); font-size:10px;
}
#foot .sp { flex:1; }

/* ---------- panels ---------- */
.pnl { background:var(--panel); border:1px solid var(--line); border-radius:5px; margin-bottom:10px; }
.pnl-h {
  display:flex; align-items:center; gap:10px; padding:6px 10px;
  border-bottom:1px solid var(--line); background:linear-gradient(#101722,#0d131c);
}
.pnl-t { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--txt); }
.pnl-i { font-size:12px; }
.pnl-n { color:var(--dim2); font-family:var(--mono); font-weight:400; font-size:10px; }
.pnl-a { margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.pnl-b { padding:10px; }
.pnl-b.nopad { padding:0; }

/* ---------- primitives ---------- */
.grid3,.grid4,.grid6 { display:grid; gap:8px; margin-bottom:10px; }
.grid3 { grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); }
.grid4 { grid-template-columns:repeat(auto-fit,minmax(115px,1fr)); }
.grid6 { grid-template-columns:repeat(auto-fit,minmax(105px,1fr)); }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:1100px){ .two-col { grid-template-columns:1fr; } }

.stat { background:var(--panel2); border:1px solid var(--line); border-radius:var(--r); padding:6px 8px; }
.stat-l { color:var(--dim2); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; }
.stat-v { font-family:var(--mono); font-size:15px; margin-top:2px; }
.stat-v.tone-up { color:var(--up); } .stat-v.tone-down { color:var(--down); } .stat-v.tone-warn { color:var(--warn); }
.stat-s { color:var(--dim2); font-size:9.5px; margin-top:1px; }

.badge { display:inline-block; padding:1px 6px; border-radius:8px; font-size:9.5px; letter-spacing:.04em;
  border:1px solid var(--line); color:var(--dim); background:#121a25; white-space:nowrap; }
.b-up { color:var(--up); border-color:#1e4a39; background:#0d1c17; }
.b-down { color:var(--down); border-color:#4d2020; background:#1c0e0e; }
.b-warn { color:var(--warn); border-color:#4a3a1a; background:#1c160c; }
.b-i { color:var(--accent); border-color:#1d3a5c; background:#0e1826; }
.b-sim { color:var(--sim); border-color:#3a3160; background:#15122a; }

.chip {
  background:#121a25; border:1px solid var(--line); color:var(--dim); cursor:pointer;
  border-radius:10px; padding:2px 8px; font:inherit; font-size:10px; white-space:nowrap;
}
.chip:hover { color:var(--txt); border-color:var(--accent2); }
.chip.on { color:var(--accent); border-color:var(--accent2); background:#0e1826; }
.chip.tick { font-family:var(--mono); }
.chip.tick.up { color:var(--up); } .chip.tick.down { color:var(--down); }
.chip.choke { color:var(--warn); border-color:#4a3a1a; }
.btn {
  background:#141d29; border:1px solid var(--line); color:var(--txt); cursor:pointer;
  padding:5px 11px; border-radius:var(--r); font:inherit; font-size:11px;
}
.btn:hover { border-color:var(--accent2); }
.btn.primary { background:#123055; border-color:#1d4c85; color:#cfe3ff; }
.btn.primary:hover { background:#17406f; }
.mini {
  background:none; border:1px solid var(--line); color:var(--dim); cursor:pointer;
  padding:2px 7px; border-radius:var(--r); font:inherit; font-size:10px;
}
.mini:hover { color:var(--accent); border-color:var(--accent2); }

.seg { display:inline-flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.seg-b {
  background:none; border:none; border-right:1px solid var(--line); color:var(--dim);
  padding:4px 9px; cursor:pointer; font:inherit; font-size:10.5px; white-space:nowrap;
}
.seg-b:last-child { border-right:none; }
.seg-b:hover { background:#141b25; color:var(--txt); }
.seg-b.on { background:#123055; color:#cfe3ff; }

.bar { height:5px; background:#151d27; border-radius:3px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); }
.bar i.b-up { background:var(--up); } .bar i.b-down { background:var(--down); } .bar i.b-warn { background:var(--warn); }

.dot { display:inline-block; width:7px; height:7px; border-radius:2px; vertical-align:middle; }
.cv { display:block; width:100%; }
.spark { display:block; }
.empty { padding:20px 12px; text-align:center; color:var(--dim2); }
.empty small { display:block; margin-top:4px; font-size:10px; color:#4a545f; }
.note { color:var(--dim); font-size:11px; margin:6px 0; line-height:1.5; }
.note.small { font-size:10px; color:var(--dim2); }
.ok-note { color:var(--up); font-size:11px; }
.lg-note { color:var(--dim2); font-size:10px; }
.more { padding:8px; text-align:center; color:var(--dim2); font-size:10px; }
.loading { padding:16px; color:var(--dim2); }

/* ---------- table ---------- */
.tbl-w { overflow-x:auto; }
.tbl { width:100%; border-collapse:collapse; font-size:11px; }
.tbl th {
  text-align:left; color:var(--dim2); font-weight:500; font-size:9.5px; text-transform:uppercase;
  letter-spacing:.05em; padding:4px 7px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.tbl td { padding:4px 7px; border-bottom:1px solid #131a24; vertical-align:middle; }
.tbl tbody tr:hover { background:#101722; }
.tbl tr.clk { cursor:pointer; }
.tbl tr.win td:first-child { box-shadow:inset 2px 0 0 var(--up); }
.tbl tr.loss td:first-child { box-shadow:inset 2px 0 0 var(--down); }
.tbl tr.cur { background:#111d2e; }
.a-r { text-align:right; font-family:var(--mono); }
.a-c { text-align:center; }
.addr { font-size:10px; color:var(--dim); }
.addr.full { display:block; padding:6px; background:var(--bg); border-radius:var(--r); word-break:break-all; margin:6px 0; }

/* ---------- fields ---------- */
.fld { display:flex; flex-direction:column; gap:3px; }
.fld-l { color:var(--dim2); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; }
.fld-h { color:var(--dim2); font-size:9.5px; line-height:1.4; }
input[type=text],input[type=number],input[type=password],input[type=search],select {
  background:var(--bg); border:1px solid var(--line); color:var(--txt);
  border-radius:var(--r); padding:5px 8px; font:inherit; font-size:11px; outline:none; width:100%;
}
input:focus,select:focus { border-color:var(--accent2); }
input[type=range] { width:100%; accent-color:var(--accent); }
.sld { display:flex; align-items:center; gap:8px; }
.sld input { flex:1; }
.sld-v { font-family:var(--mono); font-size:11px; color:var(--accent); min-width:44px; text-align:right; }

/* ---------- desk ---------- */
.desk { display:grid; grid-template-columns:330px minmax(0,1fr) 300px; gap:10px; align-items:start; }
@media (max-width:1500px){ .desk { grid-template-columns:300px minmax(0,1fr); } .desk-r { grid-column:1 / -1; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px; } }
@media (max-width:1000px){ .desk { grid-template-columns:1fr; } }
.desk-l,.desk-m,.desk-r { min-width:0; }

.wire-f { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.wire-k { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.wire-s { margin-bottom:8px; }
.wire { max-height:calc(100vh - 300px); overflow-y:auto; margin:0 -10px -10px; }
.wire.compact { max-height:none; margin:0; }
.st { padding:7px 10px; border-bottom:1px solid #131a24; cursor:pointer; border-left:2px solid transparent; }
.st:hover { background:#101722; }
.st.hot { border-left-color:var(--down); }
.st.k-conflict { border-left-color:#7a2d2d; }
.st.k-energy { border-left-color:#7a5b1e; }
.st.k-monetary { border-left-color:#2d5a7a; }
.st.k-trade { border-left-color:#2d7a5f; }
.st-top { display:flex; align-items:center; gap:6px; margin-bottom:3px; font-size:9.5px; color:var(--dim2); }
.st-k { text-transform:uppercase; letter-spacing:.05em; color:var(--dim2); }
.st-src { color:var(--dim); }
.st-ago { margin-left:auto; font-family:var(--mono); }
.st-h { font-size:11.5px; font-weight:500; line-height:1.4; margin:0 0 4px; color:var(--txt);
  text-transform:none; letter-spacing:normal; }
.st-tags { display:flex; gap:4px; flex-wrap:wrap; }
.imp { display:inline-flex; gap:1.5px; }
.imp i { width:4px; height:4px; border-radius:1px; background:#222c3a; display:block; }
.imp i.on { background:var(--dim); }
.imp i.on.i4 { background:var(--warn); }
.imp i.on.i5 { background:var(--down); }

/* map */
.p-map .pnl-b { position:relative; }
.map-host { position:relative; background:#070a0e; }
.worldmap { display:block; width:100%; height:min(58vh,620px); cursor:grab; }
.worldmap.dragging { cursor:grabbing; }
.lm-grat-l { fill:none; stroke:#111925; stroke-width:.8; }
.lm-c { fill:#141c26; stroke:#0a0d12; stroke-width:.6; transition:fill .25s; }
.lm-c.known { fill:#1a2330; }
.lm-c:hover { stroke:var(--accent); stroke-width:1.1; }
.lm-c.sel { stroke:var(--accent); stroke-width:1.6; }
.lm-c.dim { opacity:.42; }
.lm-arc { fill:none; stroke:rgba(76,154,255,.42); }
.lm-arc-conflict { stroke:rgba(240,82,82,.5); }
.lm-arc-energy { stroke:rgba(232,163,61,.5); }
.lm-arc-trade { stroke:rgba(49,196,141,.42); }
.lm-arc:hover { stroke-width:3; }
.lm-pin { cursor:pointer; }
.lm-pin-shape { fill:rgba(76,154,255,.22); stroke:var(--accent); stroke-width:1.1; }
.lm-pin-core { fill:#fff; }
.lm-pin-conflict .lm-pin-shape { fill:rgba(240,82,82,.24); stroke:var(--down); }
.lm-pin-choke .lm-pin-shape { fill:rgba(232,163,61,.24); stroke:var(--warn); }
.lm-pulse { fill:none; stroke:var(--down); stroke-width:1; opacity:.6; animation:pulse 2.4s ease-out infinite; }
@keyframes pulse { 0%{ transform:scale(.6); opacity:.7; } 100%{ transform:scale(2.6); opacity:0; } }
.map-tip {
  position:absolute; z-index:50; background:#0f1620; border:1px solid var(--line);
  padding:5px 8px; border-radius:var(--r); pointer-events:none; max-width:250px; font-size:10.5px;
  box-shadow:0 6px 18px rgba(0,0,0,.6);
}
.map-tip b { display:block; color:var(--txt); }
.map-tip span { color:var(--dim2); font-size:9.5px; }
.map-legend { display:flex; align-items:center; gap:12px; padding:5px 10px; border-top:1px solid var(--line); flex-wrap:wrap; }
.lg-scale { display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--dim2); }
.lg-grad { display:inline-block; width:80px; height:7px; border-radius:3px;
  background:linear-gradient(90deg,#1a222d,#1e4258,#486c5a,#bc943c,#d6543c,#e83434); }
.lg-k { display:flex; align-items:center; gap:4px; font-size:9.5px; color:var(--dim2); }
.lg-pin { width:8px; height:8px; border-radius:50%; display:inline-block; border:1px solid; }
.lg-pin.lm-pin-event { border-color:var(--accent); background:rgba(76,154,255,.25); }
.lg-pin.lm-pin-conflict { border-color:var(--down); background:rgba(240,82,82,.25); }
.lg-pin.lm-pin-choke { border-color:var(--warn); background:rgba(232,163,61,.25); transform:rotate(45deg); border-radius:1px; }
.sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 3px; }
.sw.up { background:rgba(49,196,141,.4); border:1px solid var(--up); }
.sw.down { background:rgba(240,82,82,.4); border:1px solid var(--down); }

.brief2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:900px){ .brief2 { grid-template-columns:1fr; } }
.kv { display:flex; gap:6px; margin:4px 0; font-size:11px; }
.kv b { color:var(--dim2); font-weight:500; }

/* ---------- cascade ---------- */
.seed-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:6px; margin-bottom:10px; }
.seed-c {
  text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:var(--r);
  padding:7px 9px; cursor:pointer; color:var(--txt); font:inherit;
}
.seed-c:hover { border-color:var(--accent2); }
.seed-c.on { background:#111d2e; border-color:var(--accent2); }
.seed-c b { display:block; font-size:11.5px; margin-bottom:2px; }
.seed-c span { color:var(--dim2); font-size:9.5px; }
.casc-ctl { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
.casc-cols { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
@media (max-width:1300px){ .casc-cols { grid-template-columns:1fr; } }

.read-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:4px; }
.read-head h3 { font-size:15px; margin:0; }
.chain-text { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin:10px 0; line-height:2; }
.ct-seg { display:inline-flex; align-items:center; gap:5px; }
.ct-seg b { background:#121a25; border:1px solid var(--line); border-radius:10px; padding:3px 9px; font-size:11px; font-weight:500; }
.ct-seg i { font-style:normal; color:var(--warn); font-family:var(--mono); font-size:9.5px; }
.ct-seg u { text-decoration:none; color:var(--dim2); margin:0 2px; }

.graph-host { overflow-x:auto; padding:6px; background:#080b10; }
.cgraph { display:block; }
.cg-e { fill:none; stroke:#25405e; opacity:.75; }
.cg-e.neg { stroke:#5a2a2a; }
.cg-n { cursor:pointer; }
.cg-n rect { fill:#121a25; stroke:#22303f; }
.cg-n:hover rect { stroke:var(--accent); }
.cg-n.sel rect { stroke:var(--accent); stroke-width:1.6; }
.cg-n .cg-bar { fill:var(--accent); stroke:none; }
.cg-n.pos .cg-bar { fill:var(--up); }
.cg-n.neg .cg-bar { fill:var(--down); }
.cg-n.k-shock .cg-bar { fill:var(--warn); }
.cg-n text { fill:var(--txt); font:10.5px var(--sans); }
.cg-n .cg-sub { fill:var(--dim2); font-size:8.5px; font-family:var(--mono); }

.sec-list { display:flex; flex-direction:column; gap:9px; }
.sec-row { border-bottom:1px solid #131a24; padding-bottom:8px; }
.sec-h { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.sec-h b { flex:1; font-size:11.5px; font-weight:500; }
.modal-b h3, .read-head h3, .vd-t h3 { text-transform:none; letter-spacing:normal; }
.sec-h span { font-family:var(--mono); font-size:11px; }
.sec-lead { display:flex; gap:4px; flex-wrap:wrap; margin:5px 0 3px; }

<script>
/* ==== assets/js/core.js ==== */
/* Lumen Terminal — core runtime: store, event bus, deterministic RNG, formatting, DOM helpers. */
(function (global) {
  'use strict';

  /* ---------- deterministic RNG (mulberry32) ---------- */
  function hashStr(s) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;

  function gauss(r) {

    clamp: function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    sum: function (a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; },
    mean: function (a) { return a.length ? M.sum(a) / a.length : 0; },
    stdev: function (a) {

    median: function (a) {

    quantile: function (a, q) {

    pearson: function (x, y) {

      if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B';
      if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M';
      if (a >= 1e3) return s + (a / 1e3).toFixed(1) + 'K';
      return s + a.toFixed(0);
    },
    usdc: function (v) { return (v < 0 ? '-$' : '$') + F.compact(Math.abs(v)); },
    pct: function (v, dp) {

      return (v >= 0 ? '+' : '') + v.toFixed(dp === undefined ? 2 : dp) + '%';
    },
    pctRaw: function (v, dp) {
      if (v === null || v === undefined || isNaN(v)) return '—';

    },
    signed: function (v, dp) { return (v >= 0 ? '+' : '') + F.num(v, dp); },
    date: function (d) {

    },
    time: function (d) {

    },
    ago: function (d) {

    mode: 'demo',                 // 'demo' | 'live'
    proxyBase: '',                // e.g. /.netlify/functions/proxy
    keys: { alpaca: '', alpacaSecret: '', finnhub: '', marketaux: '', etherscan: '', fmp: '' },
    account: { equity: 100000, riskPerTrade: 1.0, maxPositions: 8, maxSectorPct: 30 },
    watchlist: ['SPY', 'NVDA', 'TSLA', 'XOM', 'LMT', 'GC=F', 'CL=F', 'BTC'],
    filters: { region: 'ALL', sector: 'ALL', minImpact: 2 },

  function deepMerge(base, over) {
    var out = {};
    for (var k in base) out[k] = base[k];

    view: 'desk',
    focusCountry: null,     // ISO-2

      t = setTimeout(function () { fn.apply(self, args); }, ms || 150);

/* ==== assets/js/data/world.js ==== */

/* Lumen Terminal — Cascade: propagate a shock and read the consequences. */
(function (global) {
  'use strict';
  var L = global.Lumen, U = global.UNIVERSE, C = global.CASCADE, UIx = global.UI, el = L.el, F = L.F, M = L.M;

  var st = { seed: 'me_conflict', sev: 0.65, depth: 5, minP: 0.10, selected: null };
  var run = null, ex = null, bodyEl = null;

  function mount(world, params) {
    if (params.seed) st.seed = params.seed;
    if (params.sev !== undefined) st.sev = params.sev;

    var root = el('div', { class: 'casc' });
    root.appendChild(controls(world, root));
    bodyEl = el('div', { class: 'casc-body', id: 'casc-body' });
    root.appendChild(bodyEl);
    renderBody(world);
    return root;
  }

  function compute() {
    run = C.propagate(st.seed, st.sev, { maxDepth: st.depth, minP: st.minP });
    ex = C.expressions(run);
    global.APP.scenario = { run: run, ex: ex };
  }

  function rerender(world) {
    compute();
    renderBody(world);
    var h = L.$('.casc-seedname');
    if (h) h.textContent = run.seedNode.n;
  }

  function controls(world, root) {
    var seedWrap = el('div', { class: 'seed-row' });
    C.seeds().forEach(function (n) {
      seedWrap.appendChild(el('button', {
        class: 'seed-c' + (n.id === st.seed ? ' on' : ''),
        title: n.d,
        onclick: function () {
          st.seed = n.id; st.selected = null;
          L.$$('.seed-c', seedWrap).forEach(function (b) { b.classList.remove('on'); });
          this.classList.add('on');
          rerender(world);
        }
      }, [
        el('b', { text: n.n }),
        el('span', { text: (n.c || []).map(function (c) { return (U.COUNTRIES[c] || {}).n || c; }).slice(0, 3).join(' · ') })
      ]));
    });

    return UIx.panel('Scenario', { icon: '⚡', class: 'p-seed' }, [
      seedWrap,
      el('div', { class: 'casc-ctl' }, [
        UIx.field('Severity', UIx.slider(st.sev, 0.1, 1, 0.05, function (v) { st.sev = v; rerender(world); }, function (v) { return Math.round(v * 100) + '%'; }),
          'How far the shock actually goes — scales every conditional probability in the chain.'),
        UIx.field('Max depth', UIx.slider(st.depth, 2, 7, 1, function (v) { st.depth = v; rerender(world); }, function (v) { return String(v) + ' hops'; }),
          'How many links out to follow.'),
        UIx.field('Probability floor', UIx.slider(st.minP, 0.02, 0.4, 0.02, function (v) { st.minP = v; rerender(world); }, function (v) { return Math.round(v * 100) + '%'; }),
          'Prune branches whose chain probability falls below this.')
      ])
    ]);
  }

  function renderBody(world) {
    var host = bodyEl;
    if (!host) return;
    L.clear(host);
    host.appendChild(headline(world));
    host.appendChild(chainPanel(world));
    host.appendChild(el('div', { class: 'casc-cols' }, [
      winnersPanel(world), losersPanel(world), factorPanel()
    ]));
    host.appendChild(instrumentPanel(world));
    host.appendChild(nextPanel(world));
  }

  /* ---------- headline read ---------- */
  function headline(world) {
    var top = run.nodes.filter(function (n) { return n.depth > 0; }).slice(0, 12);
    var narrative = buildNarrative();
    return UIx.panel('Read', { icon: '📖', class: 'p-read' }, [
      el('div', { class: 'read-head' }, [
        el('h3', {}, [el('span', { class: 'casc-seedname', text: run.seedNode.n })]),
        UIx.badge('severity ' + Math.round(st.sev * 100) + '%', st.sev > 0.75 ? 'down' : st.sev > 0.45 ? 'warn' : 'n'),
        UIx.badge(run.nodes.length + ' nodes reached', 'i')
      ]),
      el('p', { class: 'note', text: run.seedNode.d || '' }),
      el('div', { class: 'chain-text' }, narrative.map(function (seg, i) {
        return el('span', { class: 'ct-seg' }, [
          el('b', { text: seg.n }),
          seg.p !== null ? el('i', { text: Math.round(seg.p * 100) + '%' }) : null,
          i < narrative.length - 1 ? el('u', { text: '→' }) : null
        ]);
      })),
      el('p', { class: 'note small', text: 'Percentages are the probability of that link holding given the previous one did, at the chosen severity. They come from the edge weights in the causal graph — they are modelling assumptions, not measured frequencies.' })
    ]);
  }

  /* the plain-english chain, following the strongest consumer-facing route */
  function buildNarrative() {
    var prefer = ['s_energy', 'oil_spike', 'pump_prices', 'cpi_up', 'cost_of_living', 'discretionary_down',
      'public_anger', 'election_risk', 'subsidies', 'fiscal_deficit', 'bond_supply', 'rates_higher',
      'elec_bills', 'ev_demand', 'battery_demand', 's_battery', 'chip_supply', 's_semis', 's_defense', 's_mining'];
    var target = null;
    for (var i = prefer.length - 1; i >= 0; i--) {
      if (run.byId[prefer[i]]) { target = prefer[i]; break; }
    }
    if (!target) {
      var deep = run.nodes.filter(function (n) { return n.depth > 0; }).sort(function (a, b) { return b.depth - a.depth; })[0];
      target = deep ? deep.id : run.seed;
    }
    return C.chainTo(run, target).map(function (s, i) {
      return { n: s.n, p: i === 0 ? null : s.stepP };
    });
  }

  /* ---------- layered graph ---------- */
  function chainPanel(world) {
    var host = el('div', { class: 'graph-host' });
    var p = UIx.panel('Transmission Graph', { icon: '🕸', class: 'p-graph', bodyClass: 'nopad',
      actions: [el('span', { class: 'lg-note', text: 'click any node to trace its own chain' })] }, [host]);
    setTimeout(function () { drawGraph(host, world); }, 0);
    return p;
  }

  function drawGraph(host, world) {
    L.clear(host);
    var byDepth = {};
    run.nodes.forEach(function (n) {
      if (Math.abs(n.score) < 0.012 && n.depth > 0) return;
      (byDepth[n.depth] || (byDepth[n.depth] = [])).push(n);
    });
    var depths = Object.keys(byDepth).map(Number).sort(function (a, b) { return a - b; });
    depths.forEach(function (d) {
      byDepth[d].sort(function (a, b) { return Math.abs(b.score) - Math.abs(a.score); });
      byDepth[d] = byDepth[d].slice(0, 8);
    });

    var colW = 210, rowH = 54, padX = 14, padY = 16;
    var maxRows = Math.max.apply(null, depths.map(function (d) { return byDepth[d].length; }));
    var w = padX * 2 + depths.length * colW;
    var h = padY * 2 + maxRows * rowH;

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('class', 'cgraph');
    svg.style.minWidth = w + 'px';
    svg.style.height = h + 'px';

    var pos = {};
    depths.forEach(function (d, di) {
      var col = byDepth[d];
      var offY = (maxRows - col.length) * rowH / 2;
      col.forEach(function (n, i) {
        pos[n.id] = { x: padX + di * colW, y: padY + offY + i * rowH, n: n };
      });
    });

    /* edges */
    var gE = document.createElementNS(NS, 'g');
    Object.keys(pos).forEach(function (id) {
      var node = pos[id].n;
      (C.IN[id] || []).forEach(function (e) {
        var from = pos[e.from];
        if (!from) return;
        var a = { x: from.x + colW - 26, y: from.y + 15 };
        var b = { x: pos[id].x + 2, y: pos[id].y + 15 };
        if (b.x <= a.x) return;
        var path = document.createElementNS(NS, 'path');
        var mx = (a.x + b.x) / 2;
        path.setAttribute('d', 'M' + a.x + ' ' + a.y + ' C' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y);
        path.setAttribute('class', 'cg-e ' + (e.s > 0 ? 'pos' : 'neg'));
        path.setAttribute('stroke-width', (0.6 + e.p * e.mag * 2.4).toFixed(2));
        var t = document.createElementNS(NS, 'title');
        t.textContent = C.NODE_BY_ID[e.from].n + ' → ' + C.NODE_BY_ID[e.to].n + '\n' +
          Math.round(e.p * 100) + '% · +' + e.lag + 'd\n' + e.why;
        path.appendChild(t);
        gE.appendChild(path);
      });
    });
    svg.appendChild(gE);

    /* nodes */
    Object.keys(pos).forEach(function (id) {
      var p = pos[id], n = p.n;
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
      g.setAttribute('class', 'cg-n k-' + n.kind + (n.sign > 0 ? ' pos' : ' neg') + (st.selected === id ? ' sel' : ''));
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('width', colW - 30); r.setAttribute('height', 30);
      r.setAttribute('rx', 4);
      g.appendChild(r);
      var i1 = document.createElementNS(NS, 'rect');
      i1.setAttribute('width', 3); i1.setAttribute('height', 30);
      i1.setAttribute('class', 'cg-bar');
      g.appendChild(i1);
      var tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', 8); tx.setAttribute('y', 13);
      tx.textContent = n.name.length > 26 ? n.name.slice(0, 25) + '…' : n.name;
      g.appendChild(tx);
      var tx2 = document.createElementNS(NS, 'text');
      tx2.setAttribute('x', 8); tx2.setAttribute('y', 24);
      tx2.setAttribute('class', 'cg-sub');
      tx2.textContent = Math.round(n.chainP * 100) + '% · +' + n.lag + 'd · ' + (n.sign > 0 ? '▲' : '▼');
      g.appendChild(tx2);
      var ti = document.createElementNS(NS, 'title');
      ti.textContent = n.name + '\nbest chain ' + Math.round(n.chainP * 100) + '%, first effect ~' + n.lag + ' days\n' +
        (n.via && n.via[0] ? n.via[0].why : '');
      g.appendChild(ti);
      g.addEventListener('click', function () { st.selected = id; showNode(n, world); });
      svg.appendChild(g);
    });

    host.appendChild(svg);
  }

  function showNode(n, world) {

    var body = [
      el('div', { class: 'sd-head' }, [

  /* ---------- winners / losers ---------- */
  function sectorList(list, tone) {
    return el('div', { class: 'sec-list' }, list.map(function (s) {
      return el('div', { class: 'sec-row' }, [

  function winnersPanel() {

/* Lumen Terminal — Backtest Lab: fair value gaps, their statistics, and a strategy on top. */
(function (global) {
  'use strict';
  var L = global.Lumen, U = global.UNIVERSE, B = global.BACKTEST, UIx = global.UI, el = L.el, F = L.F, M = L.M;

  var st = {
    sym: 'NVDA', tf: '15m', days: 90,
    opts: Object.assign({}, B.DEFAULTS),
    imported: null, importName: null
  };
  var cache = { bars: null, gaps: null, stats: null, res: null };
  var bodyEl = null;

  function mount(world, params) {
    if (params.sym) { st.sym = params.sym; st.imported = null; st.importName = null; }
    if (params.tf) st.tf = params.tf;
    if (params.days) st.days = params.days;
    var root = el('div', { class: 'bt' });
    root.appendChild(controls(world));
    bodyEl = el('div', { class: 'bt-body', id: 'bt-body' });
    root.appendChild(bodyEl);
    recompute(world);
    return root;
  }

  function bars(world) {
    if (st.imported) return st.imported;
    return global.MARKET.bars(st.sym, st.tf, st.days, world);
  }

  function recompute(world) {
    var bs = bars(world);
    cache.bars = bs;
    cache.gaps = B.detect(bs, st.opts);
    cache.stats = B.stats(bs, cache.gaps, st.tf);
    cache.res = B.run(bs, st.opts, L.state.settings.account.equity);
    render(world);
  }

  /* ---------- controls ---------- */
  function controls(world) {
    var symIn = el('input', {
      class: 'sym-in', value: st.sym, spellcheck: 'false',
      onkeydown: function (e) { if (e.key === 'Enter') { st.sym = symIn.value.trim().toUpperCase(); st.imported = null; st.importName = null; recompute(world); } }
    });

    var o = st.opts;
    function numOpt(k, label, opts, hint) {
      return UIx.field(label, UIx.number(o[k], function (v) { o[k] = v; recompute(world); }, opts), hint);
    }

    var file = el('input', {
      type: 'file', accept: '.csv,text/csv', style: { display: 'none' },

    return UIx.panel('Setup', { icon: '🔬', class: 'p-btset' }, [
      el('div', { class: 'bt-row1' }, [
        UIx.field('Symbol', symIn),
        UIx.field('Timeframe', UIx.toggleRow(global.TERMINAL.TFS, st.tf, function (v) { st.tf = v; recompute(world); })),
        UIx.field('Period', UIx.toggleRow([
          { v: 30, n: '1m' }, { v: 90, n: '3m' }, { v: 180, n: '6m' }, { v: 365, n: '1y' }
        ], st.days, function (v) { st.days = +v; recompute(world); })),
        el('div', { class: 'bt-import' }, [
          el('button', { class: 'btn', text: '⭳ Import TradingView CSV', onclick: function () { file.click(); } }),
          file,

  function histogram(vals, bins, fmt) {

    for (var i = 0; i < bins; i++) {
      var a = lo + i * w, b = a + w;
      var n = vals.filter(function (v) { return v >= a && (i === bins - 1 ? v <= b : v < b); }).length;
      out.push({ k: fmt(a) + '–' + fmt(b), v: n });

/* Lumen Terminal — Book & Risk: the paper book, its exposure, and what scenarios do to it. */
(function (global) {
  'use strict';
  var L = global.Lumen, U = global.UNIVERSE, R = global.RISK, C = global.CASCADE, UIx = global.UI, el = L.el, F = L.F, M = L.M;

  var BKEY = 'lumen.book.v1';
  var book = load(), bodyEl = null;

  function load() {
    try { return JSON.parse(localStorage.getItem(BKEY)) || { positions: [], journal: [] }; }
    catch (e) { return { positions: [], journal: [] }; }
  }
  function save() {
    try { localStorage.setItem(BKEY, JSON.stringify(book)); } catch (e) { /* private mode */ }
    global.APP.positions = book.positions;
  }

  function mount(world) {
    global.APP.positions = book.positions;
    var root = el('div', { class: 'book' });
    bodyEl = el('div', { id: 'book-body' });
    root.appendChild(bodyEl);
    setTimeout(function () { render(world); }, 0);
    return root;
  }

  function marked(world) {
    return book.positions.map(function (p) {
      var q = global.MARKET.quote(p.t, world);
      var px = q ? q.price : p.entry;
      var dir = p.side === 'short' ? -1 : 1;
      var pl = (px - p.entry) * p.qty * dir;
      var e = U.findEntity(p.t);
      return Object.assign({}, p, {
        price: px, pl: pl, plPct: p.entry ? (px - p.entry) / p.entry * 100 * dir : 0,
        notional: px * p.qty, sector: e ? e.sector : null, sectorName: e ? e.sectorName : '—',
        country: e ? e.c : null
      });
    });
  }

  function render(world) {
    var host = bodyEl;
    if (!host) return;
    L.clear(host);
    var pos = marked(world);
    var eq = L.state.settings.account.equity;

    host.appendChild(alpacaPanel());
    host.appendChild(positionsPanel(pos, world, eq));
    if (pos.length) {
      host.appendChild(el('div', { class: 'book-cols' }, [exposurePanel(pos, eq), riskPanel(pos, eq)]));
      host.appendChild(scenarioPanel(pos, eq, world));
    } else {
      host.appendChild(UIx.panel('Scenario impact', { icon: '⚡' }, [
        UIx.empty('Add a position to see what each scenario does to the book',
          'Everything here is local paper — nothing is sent anywhere unless you configure Alpaca.')
      ]));
    }
    host.appendChild(matrixPanel(pos, eq, world));
  }

  /* ---------- Alpaca paper trading ---------- */
  function alpacaPanel() {
    var A = global.PROVIDERS.alpaca;
    var host = el('div', {});
    var why = A.why();

    if (why) {
      host.appendChild(el('div', { class: 'alp-off' }, [
        UIx.badge('NOT CONNECTED', 'n'),
        el('span', { text: why }),
        el('button', { class: 'mini', text: 'open settings', onclick: function () { global.APP.showSettings(); } })
      ]));
      host.appendChild(el('p', { class: 'note small', text: 'Until Alpaca is connected the book above is local paper only: it lives in this browser and no order ever leaves the page. That is the safe default — connect Alpaca when you actually want fills on their paper venue.' }));
      return UIx.panel('Alpaca paper account', { icon: '🧾', class: 'p-alp' }, [host]);
    }

    host.appendChild(el('div', { class: 'loading', text: 'Loading Alpaca paper account…' }));

    var p = UIx.panel('Alpaca paper account', {
      icon: '🧾', class: 'p-alp',
      actions: [
        el('button', { class: 'btn', text: 'Order ticket', onclick: function () { orderTicket(); } }),
        el('button', { class: 'mini', text: 'refresh', onclick: function () { load(); } })
      ]
    }, [host]);

    function load() {
      L.clear(host);
      host.appendChild(el('div', { class: 'loading', text: 'Loading…' }));
      Promise.all([A.account(), A.positions(), A.orders('open')])
        .then(function (res) {
          var acct = res[0], positions = res[1] || [], orders = res[2] || [];
          L.clear(host);
          host.appendChild(el('div', { class: 'grid4' }, [
            UIx.stat('Equity', F.usd(+acct.equity, 0)),
            UIx.stat('Cash', F.usd(+acct.cash, 0)),
            UIx.stat('Buying power', F.usd(+acct.buying_power, 0)),
            UIx.stat('Status', acct.status, { tone: acct.status === 'ACTIVE' ? 'up' : 'warn' })
          ]));
          host.appendChild(el('h4', { class: 'sd-sub', text: 'Positions' }));
          host.appendChild(positions.length
            ? UIx.table([{ t: 'Sym' }, { t: 'Qty', align: 'r' }, { t: 'Avg', align: 'r' }, { t: 'Mark', align: 'r' }, { t: 'P/L', align: 'r' }, { t: '', align: 'r' }],
                positions.map(function (x) {

  /* ---------- add / edit ---------- */
  function addForm(world, onDone) {
    var f = { t: 'NVDA', side: 'long', qty: 100, entry: 0, stop: 0, note: '' };
    var q0 = global.MARKET.quote(f.t, world);
    f.entry = q0 ? +q0.price.toFixed(2) : 0;

    symIn.addEventListener('change', function () {
      f.t = symIn.value.trim().toUpperCase();
      var q = global.MARKET.quote(f.t, world);
      if (q) { f.entry = +q.price.toFixed(2); entIn.value = f.entry; f.stop = +(f.entry * 0.97).toFixed(2); stpIn.value = f.stop; }

    function recalc() {
      L.clear(out);
      var s = L.state.settings.account;
      var plan = R.plan({ t: f.t, equity: s.equity, riskPct: s.riskPerTrade, entry: f.entry, stop: f.stop, rr: 2 });

      out.appendChild(el('div', { class: 'grid4' }, [
        UIx.stat('Suggested qty', F.num(plan.size.qty, 2), { sub: 'at ' + s.riskPerTrade + '% risk' }),
        UIx.stat('Risking', F.usd(plan.size.riskAmt, 0), { tone: 'down' }),
        UIx.stat('Notional', F.usd(f.qty * f.entry, 0)),
        UIx.stat('Breakeven WR at 2R', F.pctRaw(plan.breakevenWinRate, 0))
      ]));
      out.appendChild(el('button', {
        class: 'mini', text: 'use suggested size',

      }));

    var m = UIx.modal('Add position', [
      el('div', { class: 'bt-grid' }, [

      host.appendChild(el('div', { class: 'grid3' }, [

        })));

      ]
    }, [host]);

  }

  function matrixPanel(pos, eq, world) {
    var runs = C.seeds().map(function (n) {
      return { p: baseRate(n.id, world), run: C.propagate(n.id, 0.7) };
    });
    var mx = R.matrix(runs, pos, eq);
    return UIx.panel('Probability × impact', { icon: '🎲', class: 'p-matrix' }, [
      el('p', { class: 'note', text: 'Likelihood on the horizontal axis comes from how much the current wire is already talking about each scenario; impact is the modelled effect on your book (or on sector scores when the book is empty). Top-right is what deserves a plan.' }),
      UIx.canvasBox('', 260, function (cv) {
        global.CHART.scatter(cv, mx.map(function (m) {
          return { x: m.p, y: m.impact, label: m.short || m.name, size: 0.3, color: m.impactPct < 0 ? global.CHART.theme().down : global.CHART.theme().up };
        }), { maxX: 1 });
      }),
      UIx.table([{ t: 'Scenario' }, { t: 'Wire pressure', align: 'r' }, { t: 'Book impact', align: 'r' }, { t: 'Thrives' }, { t: 'Suffers' }, { t: '', align: 'r' }],
        mx.map(function (m) {
          return {
            cells: [m.name,
              { node: UIx.bar(m.p * 100, m.p > 0.6 ? 'down' : 'n'), align: 'r' },
              { node: el('span', { class: (m.impactPct || 0) >= 0 ? 'up' : 'down', text: m.impactPct === null ? '—' : F.pct(m.impactPct) }), align: 'r' },
              m.winners.join(', '), m.losers.join(', '),
              { node: el('button', { class: 'mini', text: 'open', onclick: function () { global.APP.go('cascade', { seed: m.id, sev: 0.7 }); } }), align: 'r' }]
          };
        }))
    ]);
  }

  /* how loudly is the wire already carrying this scenario? */
  function baseRate(seedId, world) {
    var cutoff = Date.now() - 14 * 86400e3;
    var hits = 0, tot = 0;
    world.stories.forEach(function (s) {
      if (s.t < cutoff) return;
      tot++;
      var seeds = C.seedsForStory(s);
      seeds.forEach(function (sd) { if (sd.id === seedId) hits += sd.w * (s.imp / 5); });
    });
    return M.clamp(hits / Math.max(1, tot) * 6, 0.02, 0.95);
  }

  UIx.register('book', { mount: mount });
})(window);


/* ==== assets/js/app.js ==== */
/* Lumen Terminal — application shell: world bootstrap, routing, command bar, settings. */
(function (global) {
  'use strict';
  var L = global.Lumen, U = global.UNIVERSE, UIx = global.UI, el = L.el, F = L.F;

  var App = {
    world: null,
    views: ['desk', 'cascade', 'backtest', 'links', 'whales', 'book'],
    viewNames: { desk: 'Desk', cascade: 'Cascade', backtest: 'Backtest Lab', links: 'Link Analysis', whales: 'Flows', book: 'Book & Risk' },
    positions: [],
    scenario: null
  };
  global.APP = App;

  /* ---------- world ---------- */
  function buildWorld(seed) {
    var now = Date.now();
    var stories = global.FEED.buildStories(seed, 120, now);
    var calendar = global.FEED.buildCalendar(now - 120 * 86400e3, now + 14 * 86400e3);
    var wallets = global.WHALES.buildWallets(seed, 46);
    var world = {
      seed: seed, now: now, stories: stories, calendar: calendar,
      threads: global.FEED.buildThreads(stories),
      wallets: wallets,
      flows: global.WHALES.buildFlows(seed, wallets, 30, now, { stories: stories }),
      institutional: global.WHALES.buildInstitutional(seed, now),
      live: false
    };
    global.MARKET.resetShocks();
    global.MARKET.clearQuotes();
    return world;
  }

  function refreshWorld(seed) {
    App.world = buildWorld(seed || ('demo-' + Math.floor(Date.now() / 86400000)));
    L.state.world = App.world;
    L.bus.emit('world', App.world);
  }

  /* ---------- routing ---------- */
  function go(view, params) {
    if (App.views.indexOf(view) < 0) view = 'desk';
    L.state.view = view;
    L.$$('.nav-b').forEach(function (b) { b.classList.toggle('on', b.dataset.view === view); });
    var host = L.$('#view');
    L.clear(host);
    var def = UIx.get(view);
    if (!def) { host.appendChild(UIx.empty('View "' + view + '" not built')); return; }
    host.appendChild(def.mount(App.world, params || {}));
    try { history.replaceState(null, '', '#' + view); } catch (e) { /* file:// */ }
    L.bus.emit('view', view);
  }
  App.go = go;

  /* ---------- command execution ---------- */
  function execute(input) {
    var cmd = global.TERMINAL.parse(input);
    if (!cmd) return;
    switch (cmd.k) {
      case 'link': go('links', { a: cmd.a, b: cmd.b }); break;
      case 'scan': go('links', { scan: cmd.a }); break;
      case 'backtest': go('backtest', { sym: cmd.sym, tf: cmd.tf, days: cmd.days }); break;
      case 'cascade': go('cascade', { seed: cmd.seed, sev: cmd.sev }); break;
      case 'map': {
        var ent = global.LINKER.resolve(cmd.q);
        if (ent && ent.type === 'country') { go('desk', { focus: ent.id }); }
        else UIx.toast('No country matched "' + cmd.q + '"', 'warn');
        break;
      }
      case 'chart': go('backtest', { sym: cmd.sym, tf: cmd.tf || '1h', days: 90 }); break;
      case 'watch': {
        var wl = L.state.settings.watchlist;
        if (wl.indexOf(cmd.sym) < 0) { wl.push(cmd.sym); L.saveSettings(); UIx.toast(cmd.sym + ' added to watchlist', 'up'); L.bus.emit('watchlist'); }
        break;
      }
      case 'unwatch': {
        var w2 = L.state.settings.watchlist;
        var i = w2.indexOf(cmd.sym);
        if (i >= 0) { w2.splice(i, 1); L.saveSettings(); UIx.toast(cmd.sym + ' removed', 'n'); L.bus.emit('watchlist'); }
        break;
      }
      case 'sector': go('desk', { sector: cmd.id }); break;
      case 'whales': go('whales', { asset: cmd.asset }); break;
      case 'news': go('desk', { newsQuery: cmd.q }); break;
      case 'goto': go(cmd.view); break;
      case 'risk': showRisk(cmd); break;
      case 'entity': {
        if (cmd.ent.type === 'country') go('desk', { focus: cmd.ent.id });
        else if (cmd.ent.type === 'sector') go('desk', { sector: cmd.ent.id });
        else if (cmd.ent.type === 'event') go('cascade', { seed: cmd.ent.id, sev: 0.65 });
        else go('backtest', { sym: cmd.ent.id, tf: '1h', days: 90 });
        break;
      }
      case 'help': showHelp(); break;
      case 'error': UIx.toast(cmd.msg, 'warn', 6000); break;
    }
  }
  App.execute = execute;

  function showRisk(cmd) {
    var s = L.state.settings.account;
    var plan = global.RISK.plan({
      t: cmd.sym, equity: s.equity, riskPct: s.riskPerTrade,
      entry: cmd.entry, stop: cmd.stop, rr: 2
    });
    if (!plan) { UIx.toast('Entry and stop must differ', 'warn'); return; }
    UIx.modal('Position size — ' + cmd.sym, [
      el('div', { class: 'grid4' }, [
        UIx.stat('Side', plan.side.toUpperCase()),
        UIx.stat('Quantity', F.num(plan.size.qty, 2)),
        UIx.stat('Notional', F.usd(plan.size.notional, 0)),
        UIx.stat('Risk', F.usd(plan.size.riskAmt, 0), { tone: 'down' }),
        UIx.stat('Stop distance', F.pctRaw(plan.size.stopPct)),
        UIx.stat('Leverage', plan.size.leverage.toFixed(2) + '×'),
        UIx.stat('2R target', F.num(plan.size.target2R, 2), { tone: 'up' }),
        UIx.stat('Breakeven win rate', F.pctRaw(plan.breakevenWinRate, 0))
      ]),
      el('p', { class: 'note', text: plan.note })
    ]);
  }

  function showHelp() {
    UIx.modal('Command reference', [
      el('div', { class: 'help-list' }, global.TERMINAL.HELP.map(function (h) {
        return el('div', { class: 'help-row' }, [
          el('code', { text: h.c }),
          el('span', { text: h.d }),
          el('button', { class: 'mini', text: h.ex, onclick: function () { L.$('#cmd').value = h.ex; execute(h.ex); L.$$('.modal-back').forEach(function (m) { m.remove(); }); } })
        ]);
      }))
    ], { class: 'wide' });
  }

  /* ---------- command bar ---------- */
  function mountCommandBar() {
    var input = L.$('#cmd');
    var drop = L.$('#cmd-drop');
    var sel = -1;

    function renderSuggest() {
      var items = global.TERMINAL.suggest(input.value);
      L.clear(drop);
      if (!items.length || document.activeElement !== input) { drop.style.display = 'none'; return; }
      items.forEach(function (it, i) {
        drop.appendChild(el('div', {
          class: 'cmd-s' + (i === sel ? ' on' : ''),
          onmousedown: function (e) { e.preventDefault(); input.value = it.t; run(); }
        }, [
          el('code', { text: it.t }),
          el('span', { text: it.d }),
          UIx.badge(it.k, it.k === 'cmd' ? 'n' : 'i')
        ]));
      });
      drop.style.display = 'block';
    }
    function run() {
      var v = input.value.trim();
      if (!v) return;
      drop.style.display = 'none';
      execute(v);
    }
    input.addEventListener('input', function () { sel = -1; renderSuggest(); });
    input.addEventListener('focus', renderSuggest);
    input.addEventListener('blur', function () { setTimeout(function () { drop.style.display = 'none'; }, 120); });
    input.addEventListener('keydown', function (e) {
      var items = L.$$('.cmd-s', drop);
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); renderSuggest(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(-1, sel - 1); renderSuggest(); }
      else if (e.key === 'Enter') {
        if (sel >= 0 && items[sel]) input.value = items[sel].querySelector('code').textContent;
        run();
      } else if (e.key === 'Escape') { drop.style.display = 'none'; input.blur(); }
    });
    window.addEventListener('keydown', function (e) {
      if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && document.activeElement !== input) {
        e.preventDefault(); input.focus(); input.select();
      }
    });
  }

  /* ---------- status strip ---------- */
  function marketSessions() {
    var now = new Date();
    var h = now.getUTCHours() + now.getUTCMinutes() / 60, d = now.getUTCDay();
    var wd = d >= 1 && d <= 5;
    return [
      { n: 'TOKYO', open: wd && h >= 0 && h < 6 },
      { n: 'LONDON', open: wd && h >= 7 && h < 15.5 },
      { n: 'NEW YORK', open: wd && h >= 13.5 && h < 20 },
      { n: 'CRYPTO', open: true }
    ];
  }

  function renderStatus() {
    var strip = L.$('#status');
    L.clear(strip);
    var s = L.state.settings;
    strip.appendChild(el('div', { class: 'st-clock' }, [
      el('b', { text: new Date().toISOString().slice(11, 19) + 'Z' }),
      el('span', { text: F.date(new Date()) })
    ]));
    var sess = el('div', { class: 'st-sess' });
    marketSessions().forEach(function (m) {
      sess.appendChild(el('span', { class: 'sess' + (m.open ? ' on' : ''), text: m.n }));
    });
    strip.appendChild(sess);

    /* live macro ticker */
    var tick = el('div', { class: 'st-tick' });
    ['CL=F', 'GC=F', 'US10Y', 'DXY', 'VIX', 'BTC', 'SPY'].forEach(function (t) {
      var q = global.MARKET.quote(t, App.world);
      if (!q) return;
      tick.appendChild(el('span', { class: 'tk', onclick: function () { execute('chart ' + t); } }, [
        el('b', { text: t }),
        el('i', { text: F.num(q.price, q.price > 1000 ? 0 : 2) }),
        el('u', { class: q.chgPct >= 0 ? 'up' : 'down', text: F.pct(q.chgPct) })
      ]));
    });
    strip.appendChild(tick);

    var regime = riskRegime();
    strip.appendChild(el('div', { class: 'st-right' }, [
      el('span', { class: 'regime r-' + regime.k, title: regime.why }, [regime.label]),
      el('span', { class: 'mode m-' + s.mode, title: s.mode === 'demo' ? 'Demo world — simulated data' : 'Live providers', text: s.mode.toUpperCase() })
    ]));
  }

  function riskRegime() {
    var w = App.world;
    if (!w) return { k: 'calm', label: 'RISK: —', why: '' };
    var cutoff = Date.now() - 48 * 3600e3;
    var recent = w.stories.filter(function (s) { return s.t >= cutoff; });
    var war = 0, rates = 0, n = 0;
    recent.forEach(function (s) {
      war += Math.abs((s.f && s.f.war) || 0) * (s.imp / 5);
      rates += Math.abs((s.f && s.f.rates) || 0) * (s.imp / 5);
      n++;
    });
    var vix = global.MARKET.quote('VIX', w);
    var score = (war / Math.max(1, n)) * 3 + (vix ? (vix.price - 15) / 18 : 0);
    var k = score > 1.15 ? 'high' : score > 0.6 ? 'elev' : 'calm';
    return {
      k: k,
      label: 'RISK: ' + (k === 'high' ? 'ELEVATED' : k === 'elev' ? 'WATCH' : 'CONTAINED'),
      why: 'Conflict-tagged headline pressure over 48h plus the volatility gauge. VIX ' + (vix ? vix.price.toFixed(1) : '—') + '.'
    };
  }
  App.riskRegime = riskRegime;

  /* ---------- settings ---------- */
  function showSettings() {
    var s = L.state.settings;
    var P = global.PROVIDERS;
    function keyField(id, label, hint) {
      var i = el('input', {
        type: 'password', value: s.keys[id] || '', placeholder: 'not set', autocomplete: 'off',
        oninput: L.debounce(function () { s.keys[id] = i.value.trim(); L.saveSettings(); }, 300)
      });
      return UIx.field(label, i, hint);
    }
    var body = [
      el('div', { class: 'set-sec' }, [
        el('h4', { text: 'Data mode' }),
        UIx.toggleRow([
          { v: 'demo', n: 'DEMO — built-in world' },
          { v: 'live', n: 'LIVE — real providers' }
        ], s.mode, function (v) {
          L.setSetting('mode', v);
          UIx.toast('Mode: ' + v.toUpperCase() + (v === 'live' ? ' — providers will be used where keys and CORS allow' : ''), 'i', 5000);
          renderStatus();
        }),
        el('p', { class: 'note' }, [
          'DEMO runs a deterministic simulated world: every story, price and flow is generated, and is labelled ',
          UIx.badge('SIM', 'sim'),
          '. It exists so the analytics are usable before you have any API keys — never read it as real reporting. ',
          'LIVE swaps in the providers below.'
        ])
      ]),
      el('div', { class: 'set-sec' }, [
        el('h4', { text: 'Proxy' }),
        UIx.field('Proxy base path', (function () {
          var i = el('input', {
            type: 'text', value: s.proxyBase, placeholder: '/.netlify/functions/proxy',
            oninput: L.debounce(function () { L.setSetting('proxyBase', i.value.trim()); }, 300)
          });
          return i;
        })(), 'Alpaca, Marketaux, Etherscan and FMP block direct browser calls. Deploy netlify/functions/proxy.js from this repo, set the keys as environment variables there, and put the function path here.')
      ]),
      el('div', { class: 'set-sec' }, [
        el('h4', { text: 'API keys (stored in this browser only)' }),
        keyField('finnhub', 'Finnhub key', 'Quotes + candles. Works without a proxy.'),
        keyField('alpaca', 'Alpaca key ID', 'Paper trading. Needs the proxy.'),
        keyField('alpacaSecret', 'Alpaca secret', ''),
        keyField('marketaux', 'Marketaux token', 'Entity-tagged news. Needs the proxy.'),
        keyField('etherscan', 'Etherscan key', 'On-chain balances. Needs the proxy.'),
        keyField('fmp', 'FMP key', '13F and insider data. Needs the proxy.')
      ]),
      el('div', { class: 'set-sec' }, [
        el('h4', { text: 'Account & risk' }),
        UIx.field('Account equity (USD)', UIx.number(s.account.equity, function (v) { L.setSetting('account.equity', v || 0); }, { min: 0 })),
        UIx.field('Risk per trade (%)', UIx.number(s.account.riskPerTrade, function (v) { L.setSetting('account.riskPerTrade', v || 0); }, { min: 0.05, max: 10, step: 0.05 })),
        UIx.field('Max sector concentration (%)', UIx.number(s.account.maxSectorPct, function (v) { L.setSetting('account.maxSectorPct', v || 0); }, { min: 5, max: 100 }))
      ]),
      el('div', { class: 'set-sec' }, [
        el('h4', { text: 'Map' }),
        UIx.toggleRow([{ v: 'robinson', n: 'Robinson' }, { v: 'equirect', n: 'Equirectangular' }], s.projection, function (v) {
          L.setSetting('projection', v);
          L.bus.emit('projection', v);
        })
      ]),
      el('div', { class: 'set-sec' }, [
        el('h4', { text: 'Provider reachability' }),
        UIx.table([{ t: 'Provider' }, { t: 'Gives' }, { t: 'Key' }, { t: 'Direct from browser' }],
          Object.keys(P.SPECS).map(function (id) {
            var sp = P.SPECS[id];
            return [sp.n, sp.gives,
              sp.needsKey ? (s.keys[id] ? '✓ set' : '— missing') : 'not required',
              sp.cors ? '✓ yes' : '✗ proxy required'];
          }))
      ])
    ];
    UIx.modal('Settings', body, { class: 'wide' });
  }
  App.showSettings = showSettings;

  /* ---------- disclaimer ---------- */
  function maybeDisclaimer() {
    if (L.state.settings.ackedDisclaimer) return;
    var m = UIx.modal('Read this first', [
      el('p', { text: 'Lumen is an analysis terminal. It is not investment advice, and nothing in it is a recommendation to buy or sell anything.' }),
      el('ul', {}, [
        el('li', {}, ['It ships in ', UIx.badge('DEMO', 'sim'), ' mode: the news, prices, wallets and flows are all simulated by a generator in this repo. They are internally consistent and useful for learning the tools, but they are not real events and backtests run on them are not evidence of an edge.']),
        el('li', { text: 'Live mode uses third-party APIs you supply keys for. Their data, and any conclusion drawn from it, is your responsibility to verify.' }),
        el('li', { text: 'The cascade engine outputs hypotheses with explicit probabilities. Those probabilities are modelling assumptions written into the graph, not measured frequencies.' }),
        el('li', { text: 'Trading is done against Alpaca paper accounts. Do not wire this to a live brokerage account without reviewing the order path yourself.' })
      ])
    ], {
      footer: [el('button', { class: 'btn primary', text: 'Understood', onclick: function () { L.setSetting('ackedDisclaimer', true); m.close(); } })]
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    refreshWorld();
    var nav = L.$('#nav');
    App.views.forEach(function (v) {
      nav.appendChild(el('button', { class: 'nav-b', 'data-view': v, text: App.viewNames[v], onclick: function () { go(v); } }));
    });
    L.$('#btn-settings').addEventListener('click', showSettings);
    L.$('#btn-help').addEventListener('click', showHelp);
    L.$('#btn-refresh').addEventListener('click', function () {
      refreshWorld('demo-' + Math.random().toString(36).slice(2, 8));
      UIx.toast('Regenerated the demo world with a new seed', 'i');
      go(L.state.view);
      renderStatus();
    });
    mountCommandBar();
    renderStatus();
    setInterval(renderStatus, 15000);

    var initial = (location.hash || '').replace('#', '');
    go(App.views.indexOf(initial) >= 0 ? initial : 'desk');
    maybeDisclaimer();

    L.bus.on('watchlist', function () { if (L.state.view === 'desk') go('desk'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
